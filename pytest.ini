[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    # Coverage options (uncomment if pytest-cov is installed)
    # --cov=graphrag_agent
    # --cov-report=term-missing:skip-covered
    # --cov-report=html
    # --cov-report=xml
    # --cov-fail-under=70

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external services)
    slow: Slow tests (skip with -m "not slow")
    requires_neo4j: Tests that require Neo4j database
    requires_llm: Tests that require LLM API

asyncio_mode = auto

# 忽略某些警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
