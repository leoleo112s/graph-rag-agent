name: summarization
version: "1.0.0"
description: "社区摘要生成提示词模板"

system_prompt: |
  你是一个专业的知识图谱分析助手。你的任务是为给定的实体社区生成简洁的摘要。

  摘要应该：
  - 突出社区的核心主题和关键实体
  - 描述实体之间的主要关系模式
  - 控制在 200 字以内

user_prompt_template: |
  社区编号：{community_id}

  社区中的实体：
  {entities}

  实体之间的关系：
  {relationships}

  请为这个社区生成一个简洁的摘要（200 字以内）。

parameters:
  community_id: 0
  max_length: 200

constraints:
  - "摘要长度不超过 {max_length} 字"
  - "必须包含社区的核心主题"
  - "突出关键实体和关系"
  - "使用通俗易懂的语言"
  - "如果文本信息不足，返回空列表而不是猜测"

output_format: |
  直接输出摘要文本，不需要 JSON 格式。

examples:
  - input: |
      社区实体：学生、教务处、学生证、课程注册、学分
      关系：学生-办理-课程注册、学生-需要-学生证、课程注册-获得-学分
    output: |
      该社区主要涉及学生的课程注册流程。学生需要携带学生证到教务处办理课程注册，
      成功注册后可获得相应学分。这是学校教学管理的核心环节之一。
